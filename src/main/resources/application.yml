server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:this-is-a-very-long-development-only-secret-key-change-me-in-prod}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    com.example.bookingsystem: ${APP_LOG_LEVEL:INFO}
